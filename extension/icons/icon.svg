<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0070d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Film strip frame -->
  <rect x="24" y="32" width="80" height="64" rx="6" fill="white" fill-opacity="0.95"/>

  <!-- Film holes (left) -->
  <circle cx="30" cy="42" r="2.5" fill="#0a84ff"/>
  <circle cx="30" cy="54" r="2.5" fill="#0a84ff"/>
  <circle cx="30" cy="66" r="2.5" fill="#0a84ff"/>
  <circle cx="30" cy="78" r="2.5" fill="#0a84ff"/>
  <circle cx="30" cy="86" r="2.5" fill="#0a84ff"/>

  <!-- Film holes (right) -->
  <circle cx="98" cy="42" r="2.5" fill="#0a84ff"/>
  <circle cx="98" cy="54" r="2.5" fill="#0a84ff"/>
  <circle cx="98" cy="66" r="2.5" fill="#0a84ff"/>
  <circle cx="98" cy="78" r="2.5" fill="#0a84ff"/>
  <circle cx="98" cy="86" r="2.5" fill="#0a84ff"/>

  <!-- X logo (stylized) -->
  <g transform="translate(64, 64)">
    <!-- Left stroke of X -->
    <path d="M -12 -12 L 12 12" stroke="#0a84ff" stroke-width="5" stroke-linecap="round"/>
    <!-- Right stroke of X -->
    <path d="M 12 -12 L -12 12" stroke="#0a84ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Play button indicator -->
  <circle cx="88" cy="88" r="14" fill="white"/>
  <path d="M 84 82 L 84 94 L 94 88 Z" fill="#0a84ff"/>
</svg>
